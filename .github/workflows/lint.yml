name: lint

# CI can't run the actual TensorRT/Jetson pipeline (needs the hardware +
# proprietary runtime), so this just keeps the Python honest: syntax,
# unused imports, obvious bugs. The real validation happens on-device.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check scripts/ src/
